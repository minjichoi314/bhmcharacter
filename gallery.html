<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#275649">
  <title>디지털 갤러리</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap');

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}

    body{
      min-height:100vh;
      font-family:"Gaegu","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.018) 0,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 5px
        ),
        #275649;
    }

    .frame{
      min-height:100vh;
      border:18px solid #8d653e;
      box-shadow:
        inset 0 0 0 4px #c18b57,
        inset 0 0 30px rgba(0,0,0,.34);
    }

    .shell{
      width:min(1660px,100%);
      margin:0 auto;
      padding:36px clamp(18px,3vw,42px) 70px;
    }

    .head{
      color:#f5f0dc;
      text-align:center;
      margin-bottom:42px;
    }

    .head h1{
      margin:0;
      font-family:"Nanum Pen Script","Gaegu",cursive;
      font-weight:400;
      font-size:clamp(3.4rem,7vw,6.3rem);
      line-height:.95;
      letter-spacing:.01em;
      text-shadow:1px 2px 0 rgba(255,255,255,.08);
    }

    .head::after{
      content:"";
      display:block;
      width:min(520px,70%);
      height:3px;
      margin:16px auto 0;
      background:
        repeating-linear-gradient(
          to right,
          rgba(244,241,220,.9) 0 16px,
          transparent 16px 24px
        );
      opacity:.7;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:42px 28px;
      align-items:start;
    }

    .gallery-item{
      position:relative;
      min-width:0;
      transform:rotate(var(--tilt,0deg));
      transition:transform .18s ease;
    }

    .gallery-item:hover{
      transform:rotate(0deg) translateY(-4px);
      z-index:4;
    }

    .shape-note{
      --note:#fff1a9;
      position:relative;
      width:100%;
      min-height:330px;
      padding:48px 34px 32px;
      filter:drop-shadow(0 12px 11px rgba(0,0,0,.24));
      isolation:isolate;
    }

    .shape-note::before,
    .shape-note::after{
      content:"";
      position:absolute;
      z-index:-1;
      background:var(--note);
    }

    .image-frame{
      position:relative;
      z-index:2;
      width:82%;
      margin:0 auto;
      padding:9px;
      background:rgba(255,255,255,.88);
      box-shadow:0 4px 10px rgba(73,62,38,.15);
    }

    .image-frame img{
      display:block;
      width:100%;
      aspect-ratio:14/9;
      object-fit:cover;
      background:#fff;
    }

    .meta{
      position:relative;
      z-index:3;
      margin:10px 0 0;
      text-align:center;
      color:#625b4e;
      font-size:.78rem;
      font-weight:700;
    }

    .masking-tape{
      position:absolute;
      z-index:5;
      left:50%;
      top:20px;
      width:90px;
      height:28px;
      transform:translateX(-50%) rotate(-3deg);
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.20) 0 5px,
          rgba(0,0,0,.018) 5px 6px
        ),
        rgba(248,224,181,.90);
      box-shadow:0 2px 4px rgba(0,0,0,.13);
      opacity:.94;
    }

    .gallery-item:nth-child(even) .masking-tape{
      transform:translateX(-50%) rotate(3deg);
    }

    .note-heart{
      --note:#f5c7d9;
      padding-top:72px;
      padding-bottom:48px;
    }

    .note-heart::before{
      inset:18px 18px 0;
      clip-path:polygon(
        50% 100%,
        8% 58%,
        2% 36%,
        7% 20%,
        20% 10%,
        34% 11%,
        50% 27%,
        66% 11%,
        80% 10%,
        93% 20%,
        98% 36%,
        92% 58%
      );
      border-radius:36% 36% 18% 18%;
    }

    .note-bear{
      --note:#e9cfad;
      padding-top:64px;
      padding-bottom:42px;
    }

    .note-bear::before{
      left:8%;
      right:8%;
      top:38px;
      bottom:0;
      border-radius:46% 46% 34% 34%;
    }

    .note-bear::after{
      left:10%;
      top:10px;
      width:80%;
      height:100px;
      background:
        radial-gradient(circle at 12% 45%,var(--note) 0 34px,transparent 35px),
        radial-gradient(circle at 88% 45%,var(--note) 0 34px,transparent 35px);
    }

    .note-star{
      --note:#f6df82;
      padding-top:78px;
      padding-bottom:68px;
    }

    .note-star::before{
      inset:4px;
      clip-path:polygon(
        50% 0%,
        61% 33%,
        98% 35%,
        69% 56%,
        79% 92%,
        50% 71%,
        21% 92%,
        31% 56%,
        2% 35%,
        39% 33%
      );
    }

    .note-flower{
      --note:#d9c9f0;
      padding-top:64px;
      padding-bottom:54px;
    }

    .note-flower::before{
      inset:14px;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 14%,var(--note) 0 27%,transparent 28%),
        radial-gradient(circle at 83% 33%,var(--note) 0 27%,transparent 28%),
        radial-gradient(circle at 79% 72%,var(--note) 0 27%,transparent 28%),
        radial-gradient(circle at 50% 88%,var(--note) 0 27%,transparent 28%),
        radial-gradient(circle at 20% 72%,var(--note) 0 27%,transparent 28%),
        radial-gradient(circle at 17% 33%,var(--note) 0 27%,transparent 28%),
        radial-gradient(circle at 50% 52%,var(--note) 0 34%,transparent 35%);
    }

    .note-circle{
      --note:#cbe7f4;
      padding-top:64px;
      padding-bottom:52px;
    }

    .note-circle::before{
      inset:8px;
      border-radius:50%;
    }

    .note-cloud{
      --note:#ccebd5;
      padding-top:60px;
      padding-bottom:48px;
    }

    .note-cloud::before{
      left:8%;
      right:8%;
      top:74px;
      bottom:18px;
      border-radius:42px;
      box-shadow:
        -42px 5px 0 4px var(--note),
        42px -10px 0 8px var(--note),
        -5px -48px 0 12px var(--note),
        58px 28px 0 2px var(--note),
        -58px 30px 0 4px var(--note);
    }

    .empty{
      padding:80px 20px;
      color:#e5eee8;
      text-align:center;
      border:2px dashed rgba(240,245,238,.4);
      border-radius:18px;
      font-family:"Nanum Pen Script","Gaegu",cursive;
      font-size:2rem;
    }

    @media(max-width:1200px){
      .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }

    @media(max-width:820px){
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .shape-note{min-height:290px}
    }

    @media(max-width:520px){
      .grid{grid-template-columns:1fr}
      .shape-note{min-height:320px}
    }
  </style>
</head>

<body>
  <div class="frame">
    <main class="shell">

      <header class="head">
        <h1>지금 이 순간, 우리의 이야기</h1>
      </header>

      <section id="galleryGrid" class="grid" aria-live="polite"></section>

      <div id="emptyState" class="empty">
        첫 작품을 기다리고 있어요 :)
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./assets/supabase.js"></script>
  <script src="./assets/gallery.js"></script>
</body>
</html>
