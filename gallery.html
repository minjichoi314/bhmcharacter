<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>온라인 전시장</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="summer-fair-page">
  <main class="gallery-shell summer-fair-shell">
    <header class="gallery-head">
      <div>
        <p class="eyebrow">LIVE EXHIBITION</p>
        <h1 id="eventName">온라인 전시장</h1>
        <p class="lead">현장의 다섯 대 패드에서 만든 작품이 이곳에 모입니다.</p>
      </div>
      <div>
        <span class="badge">LIVE</span>
        <p id="galleryStatus" class="status"></p>
      </div>
    </header>

    <section id="galleryGrid" class="gallery-grid"></section>
    <div id="emptyState" class="empty">
      <h2>첫 작품을 기다리고 있어요!</h2>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./assets/supabase.js"></script>
  <script src="./assets/gallery.js"></script>
</body>
</html>
