<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff8ef">
  <title>축제 참여 그림</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FESTIVAL PARTICIPATION PAD</p>
        <h1>우리의 축제 한 장</h1>
        <p class="lead">
          그림을 그리고 오늘의 축제 소감을 남겨주세요.
          제출한 작품은 행사 전시장에 함께 전시됩니다.
        </p>
      </div>
      <span class="badge">현장 참여 패드</span>
    </header>

    <section class="layout">
      <article class="panel draw-panel">
        <div class="panel-head">
          <h2>1. 그림 그리기</h2>

          <div class="tools">
            <label class="tool-label">
              색상
              <input id="colorPicker" type="color" value="#111111">
            </label>

            <label class="tool-label">
              굵기
              <input id="brushSize" type="range" min="2" max="38" value="7">
            </label>

            <button id="eraserBtn" class="tool">지우개</button>
            <button id="undoBtn" class="tool">되돌리기</button>
            <button id="clearBtn" class="tool danger">전체 지우기</button>
          </div>
        </div>

        <div id="canvasWrap">
          <canvas id="drawCanvas" width="1200" height="820"></canvas>
        </div>
      </article>

      <aside class="panel form-panel">
        <h2>2. 축제 참여 소감</h2>

        <label>
          한 줄 제목
          <input
            id="title"
            type="text"
            maxlength="36"
            placeholder="예: 오늘 가장 신났던 순간"
          >
        </label>

        <label>
          참여 소감
          <textarea
            id="message"
            rows="7"
            maxlength="180"
            placeholder="기억에 남은 순간이나 느낌을 적어주세요."
          ></textarea>
          <div id="counter" class="counter">0 / 180</div>
        </label>

        <label class="check">
          <input id="consent" type="checkbox">
          <span>
            그림과 소감이 행사 전시장에 공개되는 것에 동의합니다.
          </span>
        </label>

        <button id="submitBtn" class="primary">전시장에 걸기</button>

        <p id="status" class="status" role="status"></p>

        <div id="debug" class="debug">
          Supabase 연결 확인 중...
        </div>
      </aside>
    </section>
  </main>

  <div id="success" class="success">
    <div class="success-card">
      <img id="successImage" alt="방금 제출한 작품">
      <h2 id="successTitle"></h2>
      <p id="successMessage"></p>
      <p>
        <strong>
          <span id="countdown">8</span>초 후 다음 참여 화면으로 돌아갑니다.
        </strong>
      </p>
      <button id="nextBtn" class="primary">다음 참여자</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./assets/supabase.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
