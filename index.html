<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2d66e">
  <title>축제 그림 참여</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap');

    :root{
      --paper:#fffdf6;
      --ink:#2f2b26;
      --muted:#786f63;
      --yellow:#f2d66e;
      --green:#a8d77d;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      color:var(--ink);
      font-family:"Gaegu","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 14% 18%, rgba(255,255,255,.25), transparent 22%),
        linear-gradient(#f3d978,#edcb61);
    }

    button,input,textarea{font:inherit}
    button{cursor:pointer}

    .page{
      width:min(1500px,100%);
      margin:0 auto;
      padding:22px clamp(14px,3vw,38px) 34px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:18px;
      margin-bottom:16px;
    }

    .header h1{
      margin:0;
      font-family:"Nanum Pen Script","Gaegu",cursive;
      font-size:clamp(2.5rem,5vw,4.7rem);
      font-weight:400;
      line-height:.95;
    }

    .header p{
      margin:8px 0 0;
      color:#695b39;
      font-weight:700;
    }

    .badge{
      flex:none;
      padding:8px 13px;
      border:2px solid #6d5b2a;
      border-radius:999px;
      background:rgba(255,255,255,.55);
      font-weight:700;
    }

    .book{
      position:relative;
      overflow:hidden;
      padding:44px clamp(14px,3vw,36px) 26px;
      border:3px solid rgba(87,68,24,.18);
      border-radius:14px 14px 28px 28px;
      background:var(--paper);
      box-shadow:0 18px 42px rgba(65,46,15,.16);
    }

    .rings{
      position:absolute;
      left:28px;
      right:28px;
      top:0;
      height:34px;
      display:flex;
      justify-content:space-around;
      pointer-events:none;
    }

    .rings span{
      position:relative;
      width:9px;
      height:22px;
      background:var(--yellow);
      border-radius:0 0 9px 9px;
    }

    .rings span::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-9px;
      width:18px;
      height:18px;
      transform:translateX(-50%);
      border-radius:50%;
      background:var(--yellow);
    }

    .grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) 360px;
      gap:22px;
      align-items:stretch;
    }

    .left{
      min-width:0;
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px;
      margin-bottom:12px;
    }

    .tool,
    .tool-label{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 12px;
      border:1.5px solid #514b43;
      border-radius:999px;
      background:#fff;
      font-weight:700;
    }

    .tool-label{background:#f5f0e7}
    .tool.active{background:#34302a;color:white}
    .tool.danger{color:#a95049;border-color:#b86860}

    .canvas-frame{
      position:relative;
      overflow:hidden;
      border:2px solid #d8cebd;
      border-radius:18px;
      background:white;
      touch-action:none;
    }

    #drawCanvas{
      display:block;
      width:100%;
      height:auto;
      background:#fff;
      touch-action:none;
    }

    .note{
      position:relative;
      padding:20px 16px 18px;
      border:2px solid #e6dbc4;
      border-radius:18px;
      background:
        repeating-linear-gradient(
          to bottom,
          #fffdfa 0,
          #fffdfa 34px,
          #e7dfd3 35px
        );
    }

    .note::before{
      content:"";
      position:absolute;
      left:34px;
      top:0;
      bottom:0;
      width:1px;
      background:#e4aaa5;
    }

    .note p.helper{
      position:relative;
      z-index:2;
      margin:0 0 10px 25px;
      color:#72695f;
      font-weight:700;
      line-height:1.4;
    }

    #message{
      position:relative;
      z-index:2;
      width:100%;
      min-height:275px;
      padding:0 5px 0 27px;
      border:0;
      outline:0;
      resize:none;
      background:transparent;
      color:#2e2a25;
      font-family:"Nanum Pen Script","Gaegu",cursive;
      font-size:1.75rem;
      line-height:35px;
    }

    #message::placeholder{color:#aaa296}

    .counter{
      position:relative;
      z-index:2;
      text-align:right;
      color:#867d71;
      font-size:.82rem;
    }

    .consent{
      position:relative;
      z-index:2;
      display:flex;
      align-items:flex-start;
      gap:8px;
      margin:14px 0;
      line-height:1.45;
    }

    .submit{
      position:relative;
      z-index:2;
      width:100%;
      padding:15px;
      border:2px solid #403a31;
      border-radius:15px;
      background:var(--green);
      box-shadow:4px 4px 0 #403a31;
      font-weight:700;
      font-size:1.08rem;
    }

    .submit:disabled{opacity:.5;cursor:not-allowed}

    .status{
      min-height:23px;
      margin:10px 0 0;
      white-space:pre-line;
      line-height:1.4;
    }

    .status.error{color:#a64d46}
    .status.ok{color:#347235}

    .debug{
      margin:6px 0 0;
      color:#8a8278;
      font-size:.78rem;
    }

    .illu{
      position:absolute;
      pointer-events:none;
      user-select:none;
      z-index:2;
    }

    .pencil{
      left:8px;
      top:120px;
      width:54px;
      height:112px;
      transform:rotate(-13deg);
    }

    .books{
      right:18px;
      bottom:12px;
      width:120px;
      height:80px;
    }

    .kids{
      left:50%;
      bottom:-10px;
      width:210px;
      height:100px;
      transform:translateX(-50%);
    }

    .letters{
      right:18px;
      top:58px;
      width:95px;
      height:70px;
    }

    .success{
      display:none;
      position:fixed;
      inset:0;
      z-index:50;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(38,31,23,.72);
    }

    .success.show{display:flex}

    .success-card{
      width:min(590px,100%);
      padding:24px;
      border:3px solid #433d34;
      border-radius:26px;
      background:#fffaf1;
      box-shadow:10px 10px 0 #433d34;
      text-align:center;
    }

    .success-card img{
      width:100%;
      max-height:350px;
      object-fit:contain;
      border:2px solid #d8cebe;
      border-radius:16px;
      background:#fff;
    }

    .success-card h2{
      margin:16px 0 6px;
      font-family:"Nanum Pen Script","Gaegu",cursive;
      font-size:2.5rem;
      font-weight:400;
    }

    .success-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:14px;
    }

    .success-actions a,
    .success-actions button{
      padding:14px;
      border:2px solid #40392f;
      border-radius:14px;
      font-weight:700;
      text-decoration:none;
      color:#1f1c18;
    }

    .gallery-link{background:#c5e1f0}
    .next{background:#f2d66e}

    @media(max-width:1100px){
      .grid{grid-template-columns:1fr}
      .note{min-height:360px}
    }

    @media(max-width:760px){
      .header{
        align-items:flex-start;
        flex-direction:column;
      }

      .illu{
        opacity:.75;
      }

      .pencil{width:42px;height:88px}
      .books{width:95px;height:65px}
      .kids{width:150px;height:76px}
      .letters{width:72px;height:56px}
      .success-actions{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
      <div>
        <h1>우리의 축제 한 장</h1>
        <p>그림을 그리고, 오늘의 축제 소감을 함께 남겨주세요.</p>
      </div>
      <span class="badge">현장 참여 패드</span>
    </header>

    <section class="book">

      <div class="rings" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <!-- 작은 연필 일러스트 -->
      <svg class="illu pencil" viewBox="0 0 60 120" aria-hidden="true">
        <g fill="none" stroke="#50483d" stroke-width="2.2" stroke-linejoin="round">
          <path d="M15 92 L40 22 L51 31 L26 101 Z" fill="#ee9ca4"/>
          <path d="M40 22 L45 8 L51 31 Z" fill="#f0d39c"/>
          <path d="M45 8 L48 3 L51 31 Z" fill="#403b35"/>
          <path d="M15 92 L26 101 L12 106 Z" fill="#efc75e"/>
        </g>
      </svg>

      <!-- 한글 모양 블록 일러스트 -->
      <svg class="illu letters" viewBox="0 0 100 76" aria-hidden="true">
        <g stroke="#514a41" stroke-width="2" stroke-linejoin="round">
          <path d="M10 20 Q10 8 24 8 Q39 8 39 20 L38 36 Q25 40 11 36 Z" fill="#97c96a"/>
          <path d="M55 16 Q55 5 69 5 Q84 6 84 18 L83 33 Q69 37 56 33 Z" fill="#f0c44a"/>
          <path d="M40 47 Q40 36 53 36 Q67 36 67 48 L66 64 Q54 68 41 64 Z" fill="#ef7c73"/>
        </g>
        <g fill="#3c3833" font-family="sans-serif" font-weight="700" font-size="15">
          <text x="17" y="28">ㄹ</text>
          <text x="63" y="25">ㄱ</text>
          <text x="48" y="56">ㅂ</text>
        </g>
      </svg>

      <!-- 책 일러스트 -->
      <svg class="illu books" viewBox="0 0 125 85" aria-hidden="true">
        <g fill="none" stroke="#50483f" stroke-width="2" stroke-linejoin="round">
          <path d="M14 59 H106 L112 69 H18 Z" fill="#efb5c9"/>
          <path d="M22 44 H113 L108 55 H15 Z" fill="#c8e1f0"/>
          <path d="M13 29 H99 L106 40 H20 Z" fill="#b9deba"/>
          <path d="M24 14 H116 L110 25 H17 Z" fill="#f1d068"/>
        </g>
      </svg>

      <!-- 학생 일러스트 -->
      <svg class="illu kids" viewBox="0 0 220 105" aria-hidden="true">
        <g stroke="#51483f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 90 Q52 72 76 80 Q94 86 99 103 H29 Z" fill="#f1ce62"/>
          <path d="M111 103 Q117 83 138 80 Q163 76 182 93 L184 103 Z" fill="#f1ce62"/>
          <circle cx="66" cy="55" r="29" fill="#ffdec3"/>
          <circle cx="145" cy="55" r="29" fill="#ffdec3"/>
          <path d="M39 50 Q40 23 66 22 Q94 24 94 51 Q80 40 66 41 Q53 41 39 50 Z" fill="#76564a"/>
          <path d="M117 50 Q120 23 145 22 Q171 23 174 50 Q159 40 145 41 Q131 41 117 50 Z" fill="#65493f"/>
          <path d="M57 59 Q60 61 63 59" fill="none"/>
          <path d="M72 59 Q75 61 78 59" fill="none"/>
          <path d="M137 59 Q140 61 143 59" fill="none"/>
          <path d="M152 59 Q155 61 158 59" fill="none"/>
          <path d="M60 71 Q66 75 73 71" fill="none"/>
          <path d="M139 71 Q145 75 152 71" fill="none"/>
        </g>
      </svg>

      <div class="grid">

        <section class="left">

          <div class="toolbar">
            <label class="tool-label">
              색상
              <input id="colorPicker" type="color" value="#111111">
            </label>

            <label class="tool-label">
              굵기
              <input id="brushSize" type="range" min="2" max="38" value="7">
            </label>

            <button id="eraserBtn" class="tool">지우개</button>
            <button id="undoBtn" class="tool">되돌리기</button>
            <button id="clearBtn" class="tool danger">전체 지우기</button>
          </div>

          <div class="canvas-frame">
            <canvas id="drawCanvas" width="1200" height="1200"></canvas>
          </div>

        </section>

        <aside class="note">

          <p class="helper">
            오늘 축제에서 기억하고 싶은 순간이나 마음을 자유롭게 적어주세요.
          </p>

          <textarea
            id="message"
            maxlength="180"
            placeholder="오늘 정말 즐거웠어요!"
          ></textarea>

          <div id="counter" class="counter">0 / 180</div>

          <label class="consent">
            <input id="consent" type="checkbox">
            <span>
              그림과 소감이 디지털 갤러리에 공개되는 것에 동의합니다.
            </span>
          </label>

          <button id="submitBtn" class="submit">
            디지털 갤러리에 전송
          </button>

          <p id="status" class="status" role="status"></p>
          <p id="debug" class="debug">Supabase 연결 확인 중...</p>

        </aside>

      </div>
    </section>
  </main>

  <div id="success" class="success">
    <div class="success-card">
      <img id="successImage" alt="방금 전송한 작품">

      <h2>갤러리에 전송되었어요!</h2>
      <p id="successMessage"></p>

      <div class="success-actions">
        <a class="gallery-link" href="./gallery.html">
          디지털 갤러리 보기
        </a>

        <button id="nextBtn" class="next">
          다음 참여자
        </button>
      </div>

      <p>
        <span id="countdown">12</span>초 후 자동으로 다음 참여 화면으로 돌아갑니다.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./assets/supabase.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
