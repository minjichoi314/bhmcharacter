<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3d36b">
  <title>축제 그림 참여</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="pad-page">
  <main class="pad-shell">
    <header class="pad-topbar">
      <div class="brand">
        <h1>우리의 축제 한 장</h1>
        <p>스케치북에 그림을 그리고, 오늘의 축제 소감을 함께 남겨주세요.</p>
      </div>
      <span class="device-badge">현장 참여 패드</span>
    </header>

    <section class="sketchbook">
      <div class="binding" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="doodle doodle-pencil" aria-hidden="true">
        <svg viewBox="0 0 90 160">
          <g fill="none" stroke="#4c443a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 122 L61 24 L78 39 L37 137 Z" fill="#f2a5a8"/>
            <path d="M61 24 L69 8 L78 39 Z" fill="#f5ddb0"/>
            <path d="M69 8 L74 2 L78 39" fill="#3d3a35"/>
            <path d="M20 122 L37 137 L17 143 Z" fill="#f0c96e"/>
            <path d="M24 116 L42 132" stroke="#f5f0e9"/>
          </g>
        </svg>
      </div>

      <div class="doodle doodle-letters" aria-hidden="true">
        <svg viewBox="0 0 130 110">
          <g stroke="#4a453d" stroke-width="2.6" stroke-linejoin="round">
            <path d="M16 42 Q15 20 35 19 Q57 20 56 42 L55 62 Q36 69 16 61 Z" fill="#93c96b"/>
            <path d="M70 38 Q69 17 91 17 Q111 18 111 38 L110 57 Q92 63 71 58 Z" fill="#f2c54b"/>
            <path d="M52 75 Q52 59 69 59 Q88 59 88 76 L87 95 Q70 101 53 94 Z" fill="#ef7d76"/>
          </g>
          <g fill="#3b3934" font-family="sans-serif" font-weight="700" font-size="22">
            <text x="27" y="49">ㄹ</text><text x="82" y="44">ㄱ</text><text x="62" y="85">ㅂ</text>
          </g>
        </svg>
      </div>

      <div class="doodle doodle-books" aria-hidden="true">
        <svg viewBox="0 0 170 130">
          <g fill="none" stroke="#4e4941" stroke-width="2.8" stroke-linejoin="round">
            <path d="M28 95 H143 L149 108 H33 Z" fill="#f0b4c8"/>
            <path d="M38 75 H151 L146 91 H30 Z" fill="#c5e1f1"/>
            <path d="M26 56 H136 L143 71 H34 Z" fill="#b9dfba"/>
            <path d="M40 36 H154 L147 52 H31 Z" fill="#f3d36b"/>
            <path d="M22 113 Q57 104 88 114 Q122 104 154 113" fill="#fff9ef"/>
            <path d="M88 114 V123"/>
          </g>
        </svg>
      </div>

      <div class="doodle doodle-kids" aria-hidden="true">
        <svg viewBox="0 0 290 160">
          <g stroke="#4b453e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M47 126 Q74 100 105 112 Q128 122 135 145 H43 Z" fill="#f4cf61"/>
            <path d="M150 145 Q157 117 187 111 Q220 105 245 130 L247 145 Z" fill="#f4cf61"/>
            <circle cx="91" cy="81" r="40" fill="#ffe0c5"/>
            <circle cx="195" cy="81" r="40" fill="#ffe0c5"/>
            <path d="M54 74 Q55 36 91 35 Q129 38 129 76 Q111 60 92 62 Q73 63 54 74 Z" fill="#79594a"/>
            <path d="M156 73 Q160 36 195 35 Q231 37 235 74 Q215 60 196 62 Q177 62 156 73 Z" fill="#66493f"/>
            <path d="M76 84 Q80 87 84 84 M98 84 Q102 87 106 84 M180 84 Q184 87 188 84 M201 84 Q205 87 209 84" fill="none"/>
            <path d="M83 101 Q91 106 100 101 M187 101 Q196 106 205 101" fill="none"/>
            <path d="M55 90 Q43 91 38 106 M235 90 Q247 92 252 106" fill="none"/>
          </g>
          <g fill="#f1a9b8"><circle cx="41" cy="77" r="5"/><circle cx="246" cy="72" r="5"/><circle cx="32" cy="91" r="3"/><circle cx="258" cy="86" r="3"/></g>
        </svg>
      </div>

      <div class="doodle doodle-stars" aria-hidden="true">
        <svg viewBox="0 0 120 110">
          <g fill="none" stroke="#4d473f" stroke-width="2.5" stroke-linejoin="round">
            <path d="M28 22 L34 37 L50 39 L37 49 L41 65 L28 56 L14 65 L19 49 L6 39 L22 37 Z" fill="#f4c44f"/>
            <path d="M73 57 L78 68 L90 69 L81 77 L84 89 L73 82 L62 89 L65 77 L56 69 L68 68 Z" fill="#7ec9e8"/>
          </g>
        </svg>
      </div>

      <div class="sketchbook-grid">
        <section class="canvas-panel">
          <div class="toolbar">
            <label class="tool-label">색상 <input id="colorPicker" type="color" value="#111111"></label>
            <label class="tool-label">굵기 <input id="brushSize" type="range" min="2" max="38" value="7"></label>
            <button id="eraserBtn" class="tool">지우개</button>
            <button id="undoBtn" class="tool">되돌리기</button>
            <button id="clearBtn" class="tool danger">전체 지우기</button>
          </div>

          <div id="canvasWrap"><canvas id="drawCanvas" width="1200" height="1200"></canvas></div>
        </section>

        <aside class="note-panel">
          <p class="note-intro">오늘 축제에서 기억하고 싶은 순간이나 마음을 자유롭게 적어주세요.</p>
          <textarea id="message" maxlength="180" placeholder="오늘 정말 즐거웠어요!"></textarea>
          <div id="counter" class="counter">0 / 180</div>

          <label class="consent">
            <input id="consent" type="checkbox">
            <span>그림과 소감이 디지털 갤러리에 공개되는 것에 동의합니다.</span>
          </label>

          <button id="submitBtn" class="submit-btn">디지털 갤러리에 전송</button>
          <p id="status" class="status" role="status"></p>
          <p id="debug" class="debug">Supabase 연결 확인 중...</p>
        </aside>
      </div>
    </section>
  </main>

  <div id="success" class="success">
    <div class="success-card">
      <img id="successImage" alt="방금 전송한 작품">
      <h2>갤러리에 전송되었어요!</h2>
      <p id="successMessage"></p>

      <div class="success-actions">
        <a class="gallery-btn" href="./gallery.html">디지털 갤러리 보기</a>
        <button id="nextBtn" class="next-btn">다음 참여자</button>
      </div>

      <p><span id="countdown">12</span>초 후 자동으로 다음 참여 화면으로 돌아갑니다.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./assets/supabase.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
