<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f2d775">
  <title>우리의 축제 한 장</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap');

    :root{
      --page-yellow:#f2d775;
      --paper:#fffdf8;
      --ink:#2f2a25;
      --paper-line:#ddd4c4;
      --ring:#edcf68;
      --green-top:#caeba9;
      --green-bottom:#a0d175;
      --green-shadow:#7ead56;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overscroll-behavior:none}

    body{
      color:var(--ink);
      background:
        radial-gradient(circle at 18% 8%,rgba(255,255,255,.2),transparent 25%),
        var(--page-yellow);
      font-family:"Gaegu","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    }

    button,input{font:inherit}
    button{cursor:pointer}

    .page{
      width:min(1480px,100%);
      margin:0 auto;
      padding:20px clamp(14px,3vw,38px) 34px;
    }

    .header{margin-bottom:14px}

    .header h1{
      margin:0;
      font-family:"Nanum Pen Script","Gaegu",cursive;
      font-size:clamp(2.7rem,5vw,4.6rem);
      font-weight:400;
      line-height:.95;
    }

    .header p{
      margin:7px 0 0;
      color:#665a39;
      font-size:1.05rem;
      font-weight:700;
    }

    .book{
      position:relative;
      padding:78px clamp(12px,2.4vw,30px) 28px;
      background:var(--paper);
      border-radius:8px 8px 26px 26px;
      box-shadow:0 18px 38px rgba(77,55,17,.16);
    }

    /* 스케치북이 뜯긴 듯한 상단 종이 결 */
    .torn-edge{
      position:absolute;
      left:0;
      right:0;
      top:-16px;
      height:34px;
      overflow:hidden;
      pointer-events:none;
    }

    .torn-edge::before{
      content:"";
      position:absolute;
      inset:0 -20px 0 -20px;
      background:
        radial-gradient(circle at 10px 34px,transparent 11px,var(--paper) 12px) 0 0/38px 34px repeat-x;
      filter:drop-shadow(0 -1px 0 rgba(80,65,40,.06));
    }

    .holes{
      position:absolute;
      top:9px;
      left:54px;
      right:54px;
      height:54px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      pointer-events:none;
      z-index:2;
    }

    .hole{
      position:relative;
      width:42px;
      height:42px;
      flex:none;
      border-radius:50%;
      background:var(--page-yellow);
      box-shadow:
        inset 0 4px 6px rgba(130,98,24,.16),
        0 1px 0 rgba(255,255,255,.72);
    }

    .hole::before{
      content:"";
      position:absolute;
      left:50%;
      top:-25px;
      width:12px;
      height:37px;
      transform:translateX(-50%);
      border-radius:9px;
      background:var(--ring);
    }

    .hole::after{
      content:"";
      position:absolute;
      left:50%;
      top:5px;
      width:17px;
      height:17px;
      transform:translateX(-50%);
      border-radius:50%;
      background:rgba(255,255,255,.34);
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .palette{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }

    .color-dot{
      width:36px;
      height:36px;
      padding:0;
      border:3px solid #fff;
      border-radius:50%;
      background:var(--dot);
      box-shadow:0 0 0 1px rgba(0,0,0,.18);
      transition:transform .12s ease,box-shadow .12s ease;
      touch-action:manipulation;
    }

    .color-dot.selected{
      transform:scale(1.16);
      box-shadow:0 0 0 3px rgba(74,63,48,.38);
    }

    .controls{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
    }

    .size-control{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#f2ede4;
      font-weight:700;
    }

    .control-btn{
      border:0;
      border-radius:999px;
      padding:10px 14px;
      background:#eee8de;
      color:#39332d;
      font-weight:700;
      touch-action:manipulation;
    }

    .control-btn.active{
      color:#fff;
      background:#57514a;
    }

    .control-btn.danger{
      color:#9e4b45;
      background:#f7e5e2;
    }

    .canvas-wrap{
      position:relative;
      width:100%;
      overflow:hidden;
      border:1px solid var(--paper-line);
      border-radius:18px;
      background:#fff;
      touch-action:none;
      -webkit-user-select:none;
      user-select:none;
    }

    #drawCanvas{
      display:block;
      width:100%;
      height:auto;
      background:#fff;
      touch-action:none;
      -ms-touch-action:none;
      -webkit-user-select:none;
      user-select:none;
      cursor:crosshair;
    }

    .bottom{
      display:flex;
      justify-content:center;
      margin-top:18px;
    }

    .submit{
      min-width:min(430px,100%);
      padding:16px 28px;
      border:0;
      border-radius:999px;
      background:linear-gradient(180deg,var(--green-top),var(--green-bottom));
      color:#35502c;
      box-shadow:
        0 8px 0 var(--green-shadow),
        0 15px 26px rgba(91,122,65,.20),
        inset 0 2px 0 rgba(255,255,255,.72);
      font-size:1.18rem;
      font-weight:700;
      transform:translateY(0);
      transition:transform .12s ease,box-shadow .12s ease;
      touch-action:manipulation;
    }

    .submit:active{
      transform:translateY(6px);
      box-shadow:
        0 2px 0 var(--green-shadow),
        0 8px 18px rgba(91,122,65,.18),
        inset 0 1px 0 rgba(255,255,255,.6);
    }

    .submit:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .status{
      min-height:22px;
      margin:12px 0 0;
      text-align:center;
      white-space:pre-line;
    }

    .status.error{color:#a64b45}
    .status.ok{color:#347235}

    .debug{
      margin:5px 0 0;
      text-align:center;
      color:#8a8175;
      font-size:.76rem;
    }

    .success{
      display:none;
      position:fixed;
      inset:0;
      z-index:99;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(36,30,24,.72);
    }

    .success.show{display:flex}

    .success-card{
      width:min(580px,100%);
      padding:24px;
      background:#fffaf1;
      border-radius:26px;
      box-shadow:0 24px 70px rgba(0,0,0,.3);
      text-align:center;
    }

    .success-card img{
      width:100%;
      max-height:360px;
      object-fit:contain;
      border-radius:15px;
      background:#fff;
    }

    .success-card h2{
      margin:16px 0 7px;
      font-family:"Nanum Pen Script","Gaegu",cursive;
      font-size:2.5rem;
      font-weight:400;
    }

    .success-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:14px;
    }

    .success-actions a,
    .success-actions button{
      padding:14px;
      border:0;
      border-radius:999px;
      text-decoration:none;
      color:#27231e;
      font-weight:700;
    }

    .gallery-link{background:#cbe5f3}
    .next{background:#f0d56f}

    @media(max-width:760px){
      .book{padding-top:64px}
      .toolbar{align-items:flex-start;flex-direction:column}
      .holes{left:24px;right:24px}
      .hole{width:34px;height:34px}
      .success-actions{grid-template-columns:1fr}
      .color-dot{width:33px;height:33px}
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
      <h1>우리의 축제 한 장</h1>
      <p>그림을 그리고 디지털 갤러리에 전시해보세요.</p>
    </header>

    <section class="book">

      <div class="torn-edge" aria-hidden="true"></div>

      <div class="holes" aria-hidden="true">
        <span class="hole"></span>
        <span class="hole"></span>
        <span class="hole"></span>
        <span class="hole"></span>
        <span class="hole"></span>
        <span class="hole"></span>
        <span class="hole"></span>
        <span class="hole"></span>
      </div>

      <div class="toolbar">

        <div class="palette" aria-label="색상 선택">
          <button class="color-dot selected" style="--dot:#222222" data-color="#222222" aria-label="검정"></button>
          <button class="color-dot" style="--dot:#666666" data-color="#666666" aria-label="회색"></button>
          <button class="color-dot" style="--dot:#e95f62" data-color="#e95f62" aria-label="빨강"></button>
          <button class="color-dot" style="--dot:#f28b73" data-color="#f28b73" aria-label="코랄"></button>
          <button class="color-dot" style="--dot:#f4aa4b" data-color="#f4aa4b" aria-label="주황"></button>
          <button class="color-dot" style="--dot:#f6d65f" data-color="#f6d65f" aria-label="노랑"></button>
          <button class="color-dot" style="--dot:#7fba59" data-color="#7fba59" aria-label="초록"></button>
          <button class="color-dot" style="--dot:#71cdbb" data-color="#71cdbb" aria-label="민트"></button>
          <button class="color-dot" style="--dot:#60ade5" data-color="#60ade5" aria-label="파랑"></button>
          <button class="color-dot" style="--dot:#4967b2" data-color="#4967b2" aria-label="남색"></button>
          <button class="color-dot" style="--dot:#9d70cb" data-color="#9d70cb" aria-label="보라"></button>
          <button class="color-dot" style="--dot:#ef91b6" data-color="#ef91b6" aria-label="분홍"></button>
          <button class="color-dot" style="--dot:#8c603f" data-color="#8c603f" aria-label="갈색"></button>
        </div>

        <div class="controls">
          <label class="size-control">
            굵기
            <input id="brushSize" type="range" min="2" max="40" value="7">
          </label>

          <button id="eraserBtn" class="control-btn">지우개</button>
          <button id="undoBtn" class="control-btn">되돌리기</button>
          <button id="clearBtn" class="control-btn danger">전체 지우기</button>
        </div>

      </div>

      <div class="canvas-wrap">
        <canvas id="drawCanvas" width="1400" height="900"></canvas>
      </div>

      <div class="bottom">
        <button id="submitBtn" class="submit">전시하기</button>
      </div>

      <p id="status" class="status" role="status"></p>
      <p id="debug" class="debug">연결 확인 중...</p>

    </section>
  </main>

  <div id="success" class="success">
    <div class="success-card">
      <img id="successImage" alt="방금 전시한 작품">
      <h2>전시되었어요!</h2>

      <div class="success-actions">
        <a class="gallery-link" href="./gallery.html">디지털 갤러리 보기</a>
        <button id="nextBtn" class="next">다음 참여자</button>
      </div>

      <p><span id="countdown">10</span>초 후 자동으로 다음 참여 화면으로 돌아갑니다.</p>
    </div>
  </div>
<script src="./config.js"></script>
  <script src="./assets/supabase.js"></script>

  <script>
    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d", {willReadFrequently:true});

    const brushSize = document.getElementById("brushSize");
    const eraserBtn = document.getElementById("eraserBtn");
    const undoBtn = document.getElementById("undoBtn");
    const clearBtn = document.getElementById("clearBtn");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const paletteButtons = [...document.querySelectorAll(".color-dot")];

    let connected = false;
    let currentColor = "#222222";
    let drawing = false;
    let erasing = false;
    let history = [];
    const MAX_HISTORY = 30;

    function setStatus(message,type=""){
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function fillWhite(){
      ctx.save();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.restore();
    }

    function initCanvas(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      fillWhite();
      history = [canvas.toDataURL("image/png")];
    }

    function point(clientX,clientY){
      const rect = canvas.getBoundingClientRect();

      return {
        x:(clientX - rect.left) * (canvas.width / rect.width),
        y:(clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function begin(clientX,clientY){
      drawing = true;
      const p = point(clientX,clientY);
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);

      // Tap also leaves a visible dot
      ctx.save();
      ctx.fillStyle = erasing ? "#ffffff" : currentColor;
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(1,Number(brushSize.value)/2),0,Math.PI*2);
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
    }

    function move(clientX,clientY){
      if(!drawing) return;

      const p = point(clientX,clientY);

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Number(brushSize.value);
      ctx.strokeStyle = erasing ? "#ffffff" : currentColor;
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
    }

    function end(){
      if(!drawing) return;

      drawing = false;
      ctx.closePath();

      history.push(canvas.toDataURL("image/png"));
      if(history.length > MAX_HISTORY) history.shift();
    }

    canvas.addEventListener("pointerdown",e=>{
      if(e.pointerType === "mouse" && e.button !== 0) return;

      e.preventDefault();

      try{
        canvas.setPointerCapture(e.pointerId);
      }catch(_){}

      begin(e.clientX,e.clientY);
    },{passive:false});

    canvas.addEventListener("pointermove",e=>{
      if(!drawing) return;
      e.preventDefault();
      move(e.clientX,e.clientY);
    },{passive:false});

    canvas.addEventListener("pointerup",e=>{
      e.preventDefault();
      end();

      try{
        canvas.releasePointerCapture(e.pointerId);
      }catch(_){}
    },{passive:false});

    canvas.addEventListener("pointercancel",end,{passive:false});
    canvas.addEventListener("contextmenu",e=>e.preventDefault());

    // fallback for older Safari
    canvas.addEventListener("touchstart",e=>{
      if(window.PointerEvent) return;
      e.preventDefault();
      const t = e.touches[0];
      if(t) begin(t.clientX,t.clientY);
    },{passive:false});

    canvas.addEventListener("touchmove",e=>{
      if(window.PointerEvent) return;
      e.preventDefault();
      const t = e.touches[0];
      if(t) move(t.clientX,t.clientY);
    },{passive:false});

    canvas.addEventListener("touchend",e=>{
      if(window.PointerEvent) return;
      e.preventDefault();
      end();
    },{passive:false});

    paletteButtons.forEach(btn=>{
      btn.addEventListener("click",()=>{
        currentColor = btn.dataset.color;
        erasing = false;

        eraserBtn.classList.remove("active");
        eraserBtn.textContent = "지우개";

        paletteButtons.forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    eraserBtn.addEventListener("click",()=>{
      erasing = !erasing;
      eraserBtn.classList.toggle("active",erasing);
      eraserBtn.textContent = erasing ? "펜으로" : "지우개";
    });

    undoBtn.addEventListener("click",()=>{
      if(history.length <= 1) return;

      history.pop();

      const img = new Image();
      img.onload = ()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0);
      };

      img.src = history.at(-1);
    });

    clearBtn.addEventListener("click",()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      fillWhite();

      history.push(canvas.toDataURL("image/png"));
      if(history.length > MAX_HISTORY) history.shift();
    });

    initCanvas();

    async function connectSupabase(){
      try{
        await testSupabaseConnection();
        connected = true;
        debugEl.textContent = "연결 정상";
      }catch(err){
        connected = false;
        console.error(err);
        debugEl.textContent = "연결 확인 실패 · " + humanizeSupabaseError(err);
      }
    }

    connectSupabase();

    function randomId(){
      return crypto.randomUUID?.() ||
        `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function deviceId(){
      let id = localStorage.getItem("festival-device-id");

      if(!id){
        id = randomId();
        localStorage.setItem("festival-device-id",id);
      }

      return id;
    }

    function canvasToBlob(){
      return new Promise((resolve,reject)=>{
        canvas.toBlob(
          blob=>blob ? resolve(blob) : reject(new Error("그림 이미지를 만들지 못했습니다.")),
          "image/webp",
          0.92
        );
      });
    }

    submitBtn.addEventListener("click",async()=>{
      if(!connected){
        setStatus("Supabase 연결을 확인해주세요.","error");
        return;
      }

      submitBtn.disabled = true;
      setStatus("디지털 갤러리에 전송 중입니다...");

      let uploadedPath = null;

      try{
        const id = randomId();
        const blob = await canvasToBlob();
        const path = `${window.APP_CONFIG.EVENT_ID}/${id}.webp`;
        uploadedPath = path;

        const imageUrl = await uploadArtworkBlob(path, blob);

        await insertArtworkRow({
          id,
          event_id:window.APP_CONFIG.EVENT_ID,
          title:"축제 참여 작품",
          message:"",
          image_url:imageUrl,
          storage_path:path,
          device_id:deviceId(),
          status:window.APP_CONFIG.AUTO_APPROVE ? "approved" : "pending"
        });

        setStatus("전시되었습니다!","ok");

        document.getElementById("successImage").src = imageUrl;
        document.getElementById("success").classList.add("show");

        let n = Number(window.APP_CONFIG.AUTO_RESET_SECONDS || 10);
        const label = document.getElementById("countdown");

        label.textContent = n;

        const timer = setInterval(()=>{
          n -= 1;
          label.textContent = n;

          if(n <= 0){
            clearInterval(timer);
            resetForNext();
          }
        },1000);

        document.getElementById("nextBtn").onclick = ()=>{
          clearInterval(timer);
          resetForNext();
        };

      }catch(err){
        console.error(err);

        if(uploadedPath){
          try{
            await deleteArtworkObject(uploadedPath);
          }catch(_){}
        }

        setStatus("업로드 실패:\n" + humanizeSupabaseError(err),"error");
      }finally{
        submitBtn.disabled = false;
      }
    });

    function resetForNext(){
      document.getElementById("success").classList.remove("show");
      setStatus("");
      initCanvas();
    }
  </script>
</body>
</html>
